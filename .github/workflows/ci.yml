#
# The fork's own unit gate. Upstream ships no build/test CI; this runs the tests that
# cover the fork's changes (version/exports/instruct policy). The package resolves its
# heavy classes lazily, so the gate installs no torch/sox; the CUDA inference path is
# proved by the consumer's disposable check bed in opencharly/pod-qwen3-tts.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this package without its heavy inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Compile and test
        run: |
          python -m compileall -q qwen_tts
          python -m pytest -q tests
